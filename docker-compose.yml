version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pedidos360-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  notificaciones:
    build: .
    container_name: pedidos360-notificaciones-app
    ports:
      - "8085:8085"
    depends_on:
      - rabbitmq
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    restart: always
